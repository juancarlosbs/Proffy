name: proffy-next CI

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proffy-next
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: proffy-next/package-lock.json

      - run: npm ci
      - run: npm run lint
      # tsc --noEmit needs next-env.d.ts (generated by Next.js, gitignored);
      # `next typegen` creates it without running a full build.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
